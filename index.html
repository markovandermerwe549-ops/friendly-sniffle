<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Star Runner</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e22;color:#edf3ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(900px,94vw);padding:24px 0}header,footer{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:clamp(32px,6vw,50px);margin:6px 0 22px}small{color:#83ebc9;letter-spacing:3px}.stats{display:flex;gap:22px;text-align:right}.stats b{display:block;font-size:26px}.arena{position:relative;overflow:hidden;border:1px solid #344366;border-radius:18px;box-shadow:0 20px 80px #0006}canvas{display:block;width:100%;background:#0c1630;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#080e22d9;padding:20px}.overlay[hidden]{display:none}h2{font-size:30px;margin:0}p{color:#aebdd8;line-height:1.6}button{border:0;border-radius:9px;background:#8cf3cb;color:#09251e;padding:13px 24px;font:700 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}#pause{background:#253454;color:white;padding:9px 14px}footer{font-size:14px}@media(max-width:500px){header{align-items:start}.stats{gap:12px;font-size:12px}h2{font-size:24px}}
</style></head><body><main><header><div><small>THE COSMIC ARCADE</small><h1>Star Runner<span style="color:#8cf3cb">.</span></h1></div><div class="stats"><div>SCORE<b id="score">0</b></div><div>BEST<b id="best">0</b></div></div></header><div class="arena"><canvas width="900" height="520" aria-label="Collect gold stars with your ship and avoid red asteroids"></canvas><div class="overlay" id="overlay"><h2 id="title">A little ship. A big universe.</h2><p id="message">Collect gold stars. Dodge the asteroids.<br>How long can you keep flying?</p><button id="start">Let's fly →</button></div></div><footer><p>Arrow keys / WASD to move · Drag on touch · P to pause</p><button id="pause">Pause</button></footer></main>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),message=document.querySelector('#message'),start=document.querySelector('#start'),pauseButton=document.querySelector('#pause');
let best=0;try{best=Number(localStorage.getItem('star-runner-best'))||0}catch{}bestEl.textContent=best;
let state='ready',ship={x:450,y:430},objects=[],score=0,time=0,spawn=0,last=0,pointer=null;
const keys=new Set(),stars=Array.from({length:90},()=>({x:Math.random()*900,y:Math.random()*520,r:Math.random()*1.5+.3}));
function begin(){ship={x:450,y:430};objects=[];score=0;time=0;spawn=0;pointer=null;keys.clear();scoreEl.textContent=0;state='playing';overlay.hidden=true;pauseButton.textContent='Pause'}
function togglePause(){if(state==='playing'){state='paused';title.textContent='Taking a space break';message.textContent='Your universe will wait.';start.textContent='Resume →';overlay.hidden=false;pauseButton.textContent='Resume'}else if(state==='paused'){state='playing';overlay.hidden=true;pauseButton.textContent='Pause'}}
function end(){state='over';best=Math.max(best,score);bestEl.textContent=best;try{localStorage.setItem('star-runner-best',best)}catch{}title.textContent='One more orbit?';message.textContent='You scored '+score+' points. Best: '+best+'.';start.textContent='Fly again →';overlay.hidden=false}
start.onclick=()=>state==='paused'?togglePause():begin();pauseButton.onclick=togglePause;
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='p'&&!e.repeat)togglePause()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();pointer=null;if(state==='playing')togglePause()});
function point(e){const r=canvas.getBoundingClientRect();pointer={x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*520/r.height}}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);point(e)};canvas.onpointermove=e=>{if(canvas.hasPointerCapture(e.pointerId))point(e)};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;
function update(dt){time+=dt;const speed=370;let dx=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0),dy=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0);if(pointer){const x=pointer.x-ship.x,y=pointer.y-ship.y,d=Math.hypot(x,y);if(d>2){ship.x+=x/d*Math.min(d,speed*dt);ship.y+=y/d*Math.min(d,speed*dt)}}else{const n=Math.hypot(dx,dy)||1;ship.x+=dx/n*speed*dt;ship.y+=dy/n*speed*dt}ship.x=Math.max(18,Math.min(882,ship.x));ship.y=Math.max(22,Math.min(498,ship.y));spawn-=dt;if(spawn<=0){const gold=Math.random()<.3;objects.push({x:30+Math.random()*840,y:-30,r:gold?12:17+Math.random()*12,gold,speed:110+Math.min(time*4,260)+Math.random()*70,angle:Math.random()*6});spawn=Math.max(.16,.55-time*.005)}for(const o of objects){o.y+=o.speed*dt;o.angle+=dt;if(Math.hypot(o.x-ship.x,o.y-ship.y)<o.r+12){if(!o.gold){end();return}o.y=600;score+=10;scoreEl.textContent=score}}objects=objects.filter(o=>o.y<560)}
function draw(){ctx.clearRect(0,0,900,520);for(const s of stars){ctx.fillStyle='#acc6ff';ctx.globalAlpha=.35+s.r/3;ctx.beginPath();ctx.arc(s.x,(s.y+time*25)%520,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);ctx.fillStyle=o.gold?'#ffd578':'#c25a73';ctx.strokeStyle=o.gold?'#ffedb6':'#f292a2';ctx.lineWidth=2;ctx.beginPath();const count=o.gold?10:9;for(let i=0;i<count;i++){const a=i*Math.PI*2/count,r=o.gold?(i%2?o.r*.45:o.r):o.r*(i%2?.82:1);i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}ctx.save();ctx.translate(ship.x,ship.y);ctx.fillStyle='#64d9c1';ctx.shadowColor='#64d9c1';ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(17,17);ctx.lineTo(0,10);ctx.lineTo(-17,17);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#e0ffff';ctx.fillRect(-3,-4,6,10);if(state==='playing'){ctx.fillStyle='#ffcf7a';ctx.beginPath();ctx.moveTo(-6,18);ctx.lineTo(0,25+Math.random()*12);ctx.lineTo(6,18);ctx.fill()}ctx.restore()}
function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(state==='playing')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
