name: Test and release DevSpace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devspace-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q server.py scripts tests
      - name: Test authentication and uploads over HTTP
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript
        run: node --check static/app.js
      - name: Build exact 2.2 GB release
        run: python scripts/package.py
      - name: Check unpacker
        run: |
          cp scripts/unpack.py dist/unpack.py
          python dist/unpack.py
          test -f dist/DevSpace/server.py
          test ! -d dist/DevSpace/download-size-padding
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: devspace-${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/DevSpace.zip.part1 dist/DevSpace.zip.part2 dist/SHA256.json dist/unpack.py --target "$COMMIT" --title "DevSpace — 2.2 GB website" --notes "Download both ZIP parts, SHA256.json, and unpack.py into one folder. Run python unpack.py, then open DevSpace/start.bat on Windows or run python3 DevSpace/server.py. Open http://127.0.0.1:8080. Requires Python 3.11+. Developer username: hellodev. First launch asks you to set the developer password privately. Combined ZIP parts: exactly 2,200,000,000 bytes, including explicitly labeled padding skipped during extraction. Features: hashed passwords, registration, private file uploading, and developer profiles. This is a downloadable local website, not a hosted URL."
